; Example "app mode" launch config for TermFpGUI.
;
;   termfpgui --app /path/to/example-app.ini
;   termfpgui --app=/path/to/example-app.ini
;   termfpgui -a /path/to/example-app.ini
;
; App mode runs a single program in the main terminal (no tab strip) and,
; optionally, sets up the hover drawer.  Everything below the main keys reuses
; the same INI keys a normal profile uses, so anything a profile/drawer can do
; an app config can do too.

[App]
; Name / label for this startup config (MANDATORY).  Used as the launcher's
; display name, its profile name, and (sanitised to [a-z0-9-]) the .desktop
; basename / Wayland app_id.
name=System Monitor

; Window title (optional; defaults to name).
title=System Monitor

; Icon for the installed launcher (optional).  MUST be an SVG file.  Resolved
; relative to this config file when not absolute.
;icon=sysmon.svg

; Main program for the terminal.  Empty = your login shell.  Runs via /bin/sh
; -c, so a full command line with args/pipes works.
command=htop

; fpGUI style override (optional): e.g. fusion, plastic, win2k, motif.
;theme=fusion

; --- appearance (same keys as a profile) ---
font=Monospace-12
fg=FFFFFF
bg=101418

; --- hover drawer (same keys as a profile's drawer) ---
drawer_enabled=1
drawer_name=Logs
; Empty drawer_command = a login shell ("a copy of the terminal").
drawer_command=journalctl -f
drawer_gravity=right          ; left | right | top | bottom
drawer_size=0.40              ; 0.10 .. 0.90 of the window
drawer_anim=fade             ; fade | assemble | none
drawer_launch=onstart        ; onshow | onstart
;drawer_colors=Solarized Dark ; borrow another profile's fg/bg (rarely useful here)

; Shutdown policy for a live drawer program when the window closes:
;   none   = let it fail on PTY close (default)
;   signal = send drawer_signal
;   keys   = type drawer_keys  (\r \n \e \xNN, ^D = Ctrl-D)
drawer_shutdown=signal
drawer_signal=15             ; 15=TERM 1=HUP 2=INT 3=QUIT 9=KILL
drawer_keys=exit\r
